name: Phase 5 Check

on:
  push:
    branches:
      - codex/phase-5-auth-docs-export
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:payroll
      - run: npm run lint
      - run: npm run build
        env:
          AUTH_SECRET: phase5-ci-only-secret-not-for-production
