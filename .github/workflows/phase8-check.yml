name: Phase 8 Check

on:
  push:
    branches:
      - codex/phase-8-worker-hub-onboarding-ux
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:payroll
      - run: npm run lint
      - run: npm run build
        env:
          AUTH_SECRET: ${{ format('{0}-{1}-phase8-ci', github.run_id, github.run_attempt) }}
