name: Phase 3 Check

on:
  push:
    branches:
      - codex/phase-3-payroll

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:payroll
      - run: npm run lint
      - run: npm run build
